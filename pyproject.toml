[project]
name = "sandfall"
version = "0.1.0"
description = "A falling-sand sandbox game built with pygame-ce."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5",
    "numpy>=2.0",
]

[project.scripts]
sandfall = "sandfall.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sandfall"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".agent"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sandfall"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
